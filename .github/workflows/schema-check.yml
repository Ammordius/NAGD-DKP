name: Schema and web checks

on:
  pull_request:
  push:
    branches:
      - main
      - integration/rimi-hardening

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/check-canonical-schema.mjs
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        env:
          DKP_PG_TEST: '1'
        run: npm test
      - name: Install PostgreSQL 17 client and age
        uses: ./.github/actions/setup-postgresql-17

      - name: SQL backup export test
        env:
          DKP_PG_TEST: '1'
        run: python3 scripts/test_sql_backup.py

      - name: SQL backup fetch test
        env:
          DKP_PG_TEST: '1'
        run: python3 scripts/test_sql_backup_fetch.py

      - name: SQL restore test
        env:
          DKP_PG_TEST: '1'
        run: python3 scripts/test_sql_restore.py

      - name: Build
        working-directory: web
        run: npm run build
