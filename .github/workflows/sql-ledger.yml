# RETIRED: CSV backup SQL Ledger → GitHub Pages.
#
# The scheduled CSV supabase-backup-* pipeline is obsolete. The public change
# report is now produced by DB SQL mirror after a successful restore.
# See docs/SQL-LEDGER.md and .github/workflows/db-sql-mirror.yml.
#
# This workflow no longer schedules, no longer downloads CSV artifacts, and
# cannot overwrite GitHub Pages.

name: SQL Ledger (retired)

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type RETIRED to confirm you understand this workflow no longer publishes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sql-ledger-retired
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse retired CSV ledger
        env:
          ACK: ${{ inputs.acknowledge }}
        run: |
          set -euo pipefail
          echo "The CSV SQL Ledger workflow is retired."
          echo "Public mirror change reports are published by DB SQL mirror → GitHub Pages."
          echo "See docs/SQL-LEDGER.md"
          if [ "${ACK}" != "RETIRED" ]; then
            echo "Type RETIRED in the acknowledge input if you only needed this notice." >&2
            exit 1
          fi
          echo "Acknowledged. No Pages content was published."
