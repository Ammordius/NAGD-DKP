# Manual restore of a portable SQL backup.
# Does not run on push, pull request, or artifact upload.
# List and dry-run do not use an environment. The restore job uses sql-restore.
# Restore runs only from main. Reviewers and deployment branch policies are
# left to the environment administrator; this workflow does not inspect them.
# See docs/CI-DB-SQL-RESTORE.md.

name: DB SQL restore

on:
  workflow_dispatch:
    inputs:
      operation:
        description: List backups, dry-run a restore, or restore.
        required: true
        type: choice
        default: List available backups
        options:
          - List available backups
          - Dry-run restore
          - Restore
      source_repository:
        description: Used for dry-run and restore. Ignored when listing backups.
        required: true
        type: choice
        default: Current repository
        options:
          - Current repository
          - Rimi staging
          - Other discovered fork
      source_repository_name:
        description: owner/name when the source is Other discovered fork.
        required: false
        type: string
        default: ""
      checkpoint:
        description: Historical backup to restore. Ignored when listing backups.
        required: true
        type: choice
        default: Latest available backup
        options:
          - Latest available backup
          - Previous backup (previous distinct snapshot)
          - Latest weekly backup
          - Previous weekly backup
          - Latest monthly backup
          - Specific checkpoint by artifact name
      checkpoint_name:
        description: Artifact name. Required only for a specific checkpoint.
        required: false
        type: string
        default: ""
      artifact_id:
        description: Optional numeric id. Leave empty for a normal checkpoint.
        required: false
        type: string
        default: ""
      destination_name:
        description: Must match SQL_RESTORE_DESTINATION_NAME. Ignored when listing backups.
        required: false
        type: string
        default: ""
      confirm:
        description: For a restore, type RESTORE and the destination name. Leave empty otherwise.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: db-sql-restore
  cancel-in-progress: false

jobs:
  list:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'List available backups'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List fork backups
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
        run: python scripts/sql_backup_fetch.py --discover

  preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'Dry-run restore' || inputs.operation == 'Restore')
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.dryrun.outputs.artifact_id }}
      source_repository: ${{ steps.dryrun.outputs.source_repository }}
      artifact_name: ${{ steps.dryrun.outputs.artifact_name }}
      workflow_run_id: ${{ steps.dryrun.outputs.workflow_run_id }}
      artifact_sha256: ${{ steps.dryrun.outputs.artifact_sha256 }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve checkpoint
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REPOSITORY_NAME: ${{ inputs.source_repository_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CHECKPOINT: ${{ inputs.checkpoint }}
          CHECKPOINT_NAME: ${{ inputs.checkpoint_name }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          python scripts/sql_restore_checkpoint.py \
            --source "$SOURCE_REPOSITORY" \
            --source-name "$SOURCE_REPOSITORY_NAME" \
            --current-repository "$CURRENT_REPOSITORY" \
            --checkpoint "$CHECKPOINT" \
            --checkpoint-name "$CHECKPOINT_NAME" \
            --artifact-id "$ARTIFACT_ID"

      - name: Install PostgreSQL 17 client and age
        uses: ./.github/actions/setup-postgresql-17

      - name: Dry-run SQL restore preflight
        id: dryrun
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
          SQL_BACKUP_AGE_IDENTITY: ${{ secrets.SQL_BACKUP_AGE_IDENTITY }}
          SQL_RESTORE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SQL_RESTORE_DESTINATION_NAME: ${{ vars.SQL_RESTORE_DESTINATION_NAME }}
          SQL_RESTORE_DESTINATION_HOST: ${{ vars.SQL_RESTORE_DESTINATION_HOST }}
          SQL_RESTORE_DATABASE_NAME: ${{ vars.SQL_RESTORE_DATABASE_NAME }}
          SQL_RESTORE_PROJECT_REF: ${{ vars.SQL_RESTORE_PROJECT_REF }}
          SOURCE_REPOSITORY: ${{ steps.select.outputs.source_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.select.outputs.artifact_id }}
          PINNED_ARTIFACT_NAME: ${{ steps.select.outputs.artifact_name }}
          PINNED_WORKFLOW_RUN_ID: ${{ steps.select.outputs.workflow_run_id }}
          DESTINATION_NAME: ${{ inputs.destination_name }}
        run: |
          set -euo pipefail
          python scripts/sql_restore.py \
            --source "$SOURCE_REPOSITORY" \
            --current-repository "$CURRENT_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --expect-artifact-name "$PINNED_ARTIFACT_NAME" \
            --expect-workflow-run-id "$PINNED_WORKFLOW_RUN_ID" \
            --destination-name "$DESTINATION_NAME" \
            --report sql-restore-preflight.txt

  restore:
    needs: preflight
    if: success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'Restore'
    runs-on: ubuntu-latest
    environment: sql-restore
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL 17 client and age
        uses: ./.github/actions/setup-postgresql-17

      - name: Back up the destination before restore
        id: destination_backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SQL_BACKUP_AGE_RECIPIENT: ${{ secrets.SQL_BACKUP_AGE_RECIPIENT }}
        run: python scripts/sql_backup.py --out-dir sql-restore-destination-backup

      - name: Upload destination backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sql-restore-destination-backup-${{ steps.destination_backup.outputs.stamp }}
          path: sql-restore-destination-backup/*.tar.gz.age
          retention-days: 90
          if-no-files-found: error

      - name: Restore SQL backup
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
          SQL_BACKUP_AGE_IDENTITY: ${{ secrets.SQL_BACKUP_AGE_IDENTITY }}
          SQL_RESTORE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SQL_RESTORE_DESTINATION_NAME: ${{ vars.SQL_RESTORE_DESTINATION_NAME }}
          SQL_RESTORE_DESTINATION_HOST: ${{ vars.SQL_RESTORE_DESTINATION_HOST }}
          SQL_RESTORE_DATABASE_NAME: ${{ vars.SQL_RESTORE_DATABASE_NAME }}
          SQL_RESTORE_PROJECT_REF: ${{ vars.SQL_RESTORE_PROJECT_REF }}
          SOURCE_REPOSITORY: ${{ needs.preflight.outputs.source_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          PINNED_ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          PINNED_WORKFLOW_RUN_ID: ${{ needs.preflight.outputs.workflow_run_id }}
          PINNED_SHA256: ${{ needs.preflight.outputs.artifact_sha256 }}
          DESTINATION_NAME: ${{ inputs.destination_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          python scripts/sql_restore.py \
            --execute \
            --source "$SOURCE_REPOSITORY" \
            --current-repository "$CURRENT_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --expect-artifact-name "$PINNED_ARTIFACT_NAME" \
            --expect-workflow-run-id "$PINNED_WORKFLOW_RUN_ID" \
            --expect-sha256 "$PINNED_SHA256" \
            --destination-name "$DESTINATION_NAME" \
            --confirm "$CONFIRM" \
            --report sql-restore-report.txt
