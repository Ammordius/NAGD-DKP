# Manual restore of a portable SQL backup. Dry-run is the default.
# Does not run on push, pull request, or artifact upload.
# Inventory has no environment. sql-restore is the only approval, and a
# destructive restore refuses to run until that environment has required
# reviewers and a deployment branch policy of main only.
# See docs/CI-DB-SQL-RESTORE.md.

name: DB SQL restore

on:
  workflow_dispatch:
    inputs:
      execution:
        description: dry-run performs no writes. restore mutates the destination.
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - restore
      source_repository:
        description: Discovered owner/name from DB SQL backup discovery. Current repository uses this repository.
        required: true
        type: string
      checkpoint:
        description: Latest, previous, latest weekly, or latest monthly. The last two choices are for an older named backup.
        required: true
        type: choice
        default: Latest available backup
        options:
          - Latest available backup
          - Previous backup (previous distinct snapshot)
          - Latest weekly backup
          - Previous weekly backup
          - Latest monthly backup
          - Specific checkpoint by artifact name
      checkpoint_name:
        description: Advanced. Artifact name, only for a specific checkpoint. Leave empty otherwise.
        required: false
        type: string
        default: ""
      artifact_id:
        description: Advanced. Optional numeric id. Leave empty for a normal checkpoint.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: db-sql-restore
  cancel-in-progress: false

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      source_repository: ${{ steps.select.outputs.source_repository }}
      artifact_name: ${{ steps.select.outputs.artifact_name }}
      workflow_run_id: ${{ steps.select.outputs.workflow_run_id }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List fork backups
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
        run: python scripts/sql_backup_fetch.py --discover

      - name: Resolve checkpoint
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CHECKPOINT: ${{ inputs.checkpoint }}
          CHECKPOINT_NAME: ${{ inputs.checkpoint_name }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          SOURCE="$SOURCE_REPOSITORY"
          if [ "$SOURCE" = "Current repository" ]; then
            SOURCE="$CURRENT_REPOSITORY"
          fi
          python scripts/sql_restore_checkpoint.py \
            --source "$SOURCE" \
            --current-repository "$CURRENT_REPOSITORY" \
            --checkpoint "$CHECKPOINT" \
            --checkpoint-name "$CHECKPOINT_NAME" \
            --artifact-id "$ARTIFACT_ID"

  restore:
    needs: inventory
    if: success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sql-restore
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL 17 client and age
        uses: ./.github/actions/setup-postgresql-17

      - name: Dry-run SQL restore preflight
        id: dryrun
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
          SQL_BACKUP_AGE_IDENTITY: ${{ secrets.SQL_BACKUP_AGE_IDENTITY }}
          SQL_RESTORE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SQL_RESTORE_DESTINATION_NAME: ${{ vars.SQL_RESTORE_DESTINATION_NAME }}
          SQL_RESTORE_DESTINATION_HOST: ${{ vars.SQL_RESTORE_DESTINATION_HOST }}
          SQL_RESTORE_DATABASE_NAME: ${{ vars.SQL_RESTORE_DATABASE_NAME }}
          SQL_RESTORE_PROJECT_REF: ${{ vars.SQL_RESTORE_PROJECT_REF }}
          SOURCE_REPOSITORY: ${{ needs.inventory.outputs.source_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.inventory.outputs.artifact_id }}
          PINNED_ARTIFACT_NAME: ${{ needs.inventory.outputs.artifact_name }}
          PINNED_WORKFLOW_RUN_ID: ${{ needs.inventory.outputs.workflow_run_id }}
        run: |
          set -euo pipefail
          python scripts/sql_restore.py \
            --source "$SOURCE_REPOSITORY" \
            --current-repository "$CURRENT_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --expect-artifact-name "$PINNED_ARTIFACT_NAME" \
            --expect-workflow-run-id "$PINNED_WORKFLOW_RUN_ID" \
            --report sql-restore-preflight.txt

      - name: Require protected sql-restore environment
        if: success() && inputs.execution == 'restore'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/sql_restore.py --check-protection

      - name: Back up the destination before restore
        id: destination_backup
        if: success() && inputs.execution == 'restore'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SQL_BACKUP_AGE_RECIPIENT: ${{ secrets.SQL_BACKUP_AGE_RECIPIENT }}
        run: python scripts/sql_backup.py --out-dir sql-restore-destination-backup

      - name: Upload destination backup
        if: success() && inputs.execution == 'restore'
        uses: actions/upload-artifact@v4
        with:
          name: sql-restore-destination-backup-${{ steps.destination_backup.outputs.stamp }}
          path: sql-restore-destination-backup/*.tar.gz.age
          retention-days: 90
          if-no-files-found: error

      - name: Restore SQL backup
        if: success() && inputs.execution == 'restore'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
          SQL_BACKUP_AGE_IDENTITY: ${{ secrets.SQL_BACKUP_AGE_IDENTITY }}
          SQL_RESTORE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SQL_RESTORE_DESTINATION_NAME: ${{ vars.SQL_RESTORE_DESTINATION_NAME }}
          SQL_RESTORE_DESTINATION_HOST: ${{ vars.SQL_RESTORE_DESTINATION_HOST }}
          SQL_RESTORE_DATABASE_NAME: ${{ vars.SQL_RESTORE_DATABASE_NAME }}
          SQL_RESTORE_PROJECT_REF: ${{ vars.SQL_RESTORE_PROJECT_REF }}
          SOURCE_REPOSITORY: ${{ needs.inventory.outputs.source_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.inventory.outputs.artifact_id }}
          PINNED_ARTIFACT_NAME: ${{ needs.inventory.outputs.artifact_name }}
          PINNED_WORKFLOW_RUN_ID: ${{ needs.inventory.outputs.workflow_run_id }}
          PINNED_SHA256: ${{ steps.dryrun.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          python scripts/sql_restore.py \
            --execute \
            --source "$SOURCE_REPOSITORY" \
            --current-repository "$CURRENT_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --expect-artifact-name "$PINNED_ARTIFACT_NAME" \
            --expect-workflow-run-id "$PINNED_WORKFLOW_RUN_ID" \
            --expect-sha256 "$PINNED_SHA256" \
            --report sql-restore-report.txt
