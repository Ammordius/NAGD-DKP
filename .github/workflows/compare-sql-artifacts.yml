# Read-only comparison of portable SQL backup artifacts.
# Defaults: old = SQL_MIRROR_SOURCE latest, new = this repository latest.
# Artifact ids are optional; empty means latest. Does not restore or publish Pages.
# See docs/SQL-LEDGER.md.

name: Compare SQL artifacts

on:
  workflow_dispatch:
    inputs:
      old_repository:
        description: "Old repository owner/name (default: SQL_MIRROR_SOURCE)"
        required: false
        type: string
        default: ""
      old_artifact_id:
        description: "Old artifact id (default: latest SQL backup in that repo)"
        required: false
        type: string
        default: ""
      new_repository:
        description: "New repository owner/name (default: this repository)"
        required: false
        type: string
        default: ""
      new_artifact_id:
        description: "New artifact id (default: latest SQL backup in that repo)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: compare-sql-artifacts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age
          command -v age
          age --version

      - name: Compare SQL artifacts
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_READ_TOKEN_STAGING: ${{ secrets.BACKUP_ARTIFACT_READ_TOKEN_STAGING }}
          BACKUP_FORK_READ_TOKEN: ${{ secrets.BACKUP_FORK_READ_TOKEN }}
          BACKUP_FORK_READ_TOKEN_2: ${{ secrets.BACKUP_FORK_READ_TOKEN_2 }}
          BACKUP_FORK_READ_TOKEN_3: ${{ secrets.BACKUP_FORK_READ_TOKEN_3 }}
          BACKUP_FORK_READ_TOKEN_4: ${{ secrets.BACKUP_FORK_READ_TOKEN_4 }}
          SQL_BACKUP_AGE_IDENTITY: ${{ secrets.SQL_BACKUP_AGE_IDENTITY }}
          SQL_MIRROR_SOURCE: ${{ vars.SQL_MIRROR_SOURCE }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          OLD_REPOSITORY: ${{ inputs.old_repository }}
          OLD_ARTIFACT_ID: ${{ inputs.old_artifact_id }}
          NEW_REPOSITORY: ${{ inputs.new_repository }}
          NEW_ARTIFACT_ID: ${{ inputs.new_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p compare_out
          set +e
          python scripts/sql_artifact_compare.py \
            --old-repository "${OLD_REPOSITORY}" \
            --old-artifact-id "${OLD_ARTIFACT_ID}" \
            --new-repository "${NEW_REPOSITORY}" \
            --new-artifact-id "${NEW_ARTIFACT_ID}" \
            --current-repository "${CURRENT_REPOSITORY}" \
            --mirror-source "${SQL_MIRROR_SOURCE}" \
            --out compare_out
          rc=$?
          set -e
          echo "compare_exit=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "artifact_name=sql-compare-failed" >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi
          # Exit 2 means report written but validation failed — still upload artifact.
          if [ "$rc" -eq 2 ]; then
            echo "Comparison finished with validation failures; report artifact will still upload." >&2
            exit 2
          fi

      - name: Upload comparison artifact
        if: always() && steps.compare.outputs.has_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compare.outputs.artifact_name }}
          path: compare_out
          retention-days: 90

      - name: Scrub temporary compare files
        if: always()
        run: |
          set -euo pipefail
          rm -rf compare_out /tmp/sql-artifact-compare-* 2>/dev/null || true
